# All thresholds, window sizes, and seeds live here.
# Values marked "initial" are starting points chosen before seeing any results;
# any change is recorded in docs/DESIGN.md.

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  results: results
  figures: docs/figures
  docs: docs

seed: 0                     # global seed for anything not listed below
seeds: [0, 1, 2]            # deep models are run once per seed (D3, D4, D6)

dataset:                    # Tabrizi et al. 2020, see docs/DATASET.md
  root: data/raw/tabrizi2020
  units:                    # raw integer -> physical unit (BNO055 defaults, checked in D1)
    acc_lsb_per_m_s2: 100   # acc raw / 100 = m/s^2
    gyro_lsb_per_dps: 16    # gyro raw / 16 = deg/s (converted on to rad/s)
    mag_lsb_per_ut: 16      # mag raw / 16 = microtesla
  player_overrides:         # sample id -> player, where the sources disagree
    720: P05                # scores CSV says P06; the spreadsheet range 651-720 says P05
  stated_rates_hz:          # what the authors' papers say (reported, not used)
    "Data in Brief article, 2020": 100
    "Computational Intelligence and Neuroscience paper, 2021": 70

lopo:
  # Not used as a test player by any model that uses acc/gyro: P06 has no usable
  # acc/gyro samples once ID 720 is assigned to P05.
  excluded_test_players: [P06]

channels:                   # model inputs (names from racketimu.io)
  # Pitch wraps at ±180° in 12% of strokes, so it is given as sin/cos (roll never wraps).
  primary: [acc_x, acc_y, acc_z, gyro_x, gyro_y, gyro_z, roll_deg, pitch_sin, pitch_cos]
  # Absolute heading: may differ between recording blocks and leak the class.
  # Used only in the D3 heading check and the D6 "+ heading" condition.
  heading: [yaw_sin, yaw_cos, mag_x, mag_y, mag_z]

window:                     # D2
  n_rows: 48                # pad or crop every stroke to this many rows, with a mask
  center: peak_gyro         # align the crop on the row with peak gyro magnitude
  peak_position: 16         # the peak row lands here (16 before, 31 after); best coverage of 24/16/12

ablation:                   # D6
  row_strides: [1, 2, 4]    # keep every row, every 2nd row, every 4th row
  window_fractions: [1.0, 0.75, 0.5]  # of window.n_rows, peak kept at the same relative position
  deep_model: gru           # best deep model in D3 (highest mean pooled macro-F1; tied with CNN)

classify:                   # D3
  # Inner validation (early stopping + temperature scaling): players taken from the
  # training players only, preferring players who have all three classes.
  inner_val_players: {novice: 1, pro: 1}
  class_weight: balanced    # macro-F1 is the headline metric and classes are imbalanced
  ece_bins: 15
  checks:                   # decision rules fixed before any results were seen
    heading_gain_flag: 0.02 # RF macro-F1 gain from adding yaw + mag that counts as "noticeable"
    leak_margin_flag: 0.10  # mean-only RF macro-F1 above majority that counts as "well above"

cnn:                        # D3, small 1D CNN
  channels: [32, 64]
  kernel_size: 5
  dropout: 0.2

gru:                        # D3, small GRU
  hidden_size: 64
  dropout: 0.2

train:                      # D3, D4
  batch_size: 32
  max_epochs: 200
  early_stopping_patience: 20
  learning_rate: 0.001
  device: cpu               # cpu | mps | auto. Reported results always use cpu;
                            # mps/auto are for quick local iteration only (not bit-for-bit reproducible)

random_forest:              # D3, D4 baseline
  n_estimators: 300
  max_depth: null

latency:                    # D8
  n_runs: 1000
