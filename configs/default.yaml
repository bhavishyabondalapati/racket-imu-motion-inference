# All thresholds, window sizes, and seeds live here.
# Values marked "initial" are starting points chosen before seeing any results;
# any change is recorded in docs/DESIGN.md.

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  results: results
  figures: docs/figures
  docs: docs

seed: 0                     # global seed for anything not listed below
seeds: [0, 1, 2]            # deep models are run once per seed (D3, D4, D6)

dataset:                    # Tabrizi et al. 2020, see docs/DATASET.md
  root: data/raw/tabrizi2020
  units:                    # raw integer -> physical unit (BNO055 defaults, checked in D1)
    acc_lsb_per_m_s2: 100   # acc raw / 100 = m/s^2
    gyro_lsb_per_dps: 16    # gyro raw / 16 = deg/s (converted on to rad/s)
    mag_lsb_per_ut: 16      # mag raw / 16 = microtesla
  player_overrides:         # sample id -> player, where the sources disagree
    720: P05                # scores CSV says P06; the spreadsheet range 651-720 says P05
  stated_rates_hz:          # what the authors' papers say (reported, not used)
    data_in_brief_2020: 100
    cin_2021: 70

lopo:
  # Not used as a test player by any model that uses acc/gyro (1 usable sample).
  excluded_test_players: [P06]

window:                     # D2
  n_rows: 32                # pad or crop every stroke to this many rows, with a mask
  center: peak_gyro         # center the crop on the row with peak gyro magnitude

ablation:                   # D6
  row_strides: [1, 2, 4]    # keep every row, every 2nd row, every 4th row

train:                      # D3, D4
  batch_size: 32
  max_epochs: 200
  early_stopping_patience: 20
  learning_rate: 0.001
  device: cpu               # cpu | mps | auto. Reported results always use cpu;
                            # mps/auto are for quick local iteration only (not bit-for-bit reproducible)

random_forest:              # D3, D4 baseline
  n_estimators: 300
  max_depth: null

latency:                    # D8
  n_runs: 1000
