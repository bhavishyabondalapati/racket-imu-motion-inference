# All thresholds, window sizes, and seeds live here.
# Values marked "initial" are starting points chosen before seeing any data;
# they will be checked against the real dataset in the milestone noted, and any
# change is recorded in docs/DESIGN.md.

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  results: results
  figures: docs/figures

seed: 0                     # global seed for anything not listed below
seeds: [0, 1, 2]            # deep models are run once per seed (D3, D4, D6)

imu:
  resample_hz: 100          # common uniform rate after loading (initial; revisit after D1)

segment:                    # D2
  gyro_peak_threshold_rad_s: 8.0  # minimum gyro-magnitude peak height for a stroke (initial)
  min_peak_spacing_s: 1.5         # two strokes cannot be closer than this (initial)
  window_pre_s: 0.6               # window starts this long before the peak (initial)
  window_post_s: 0.4              # window ends this long after the peak (initial)

train:                      # D3, D4
  batch_size: 32
  max_epochs: 200
  early_stopping_patience: 20
  learning_rate: 0.001
  device: cpu               # cpu | mps | auto. Reported results always use cpu;
                            # mps/auto are for quick local iteration only (not bit-for-bit reproducible)

random_forest:              # D3, D4 baseline
  n_estimators: 300
  max_depth: null

latency:                    # D8
  n_runs: 1000
