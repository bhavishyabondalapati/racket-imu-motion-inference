name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-26.04  # pinned: a GitHub image upgrade must be a deliberate change here
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install CPU-only torch
        # The default Linux torch wheel bundles CUDA (~2 GB). CI has no GPU, so install
        # the same pinned version from PyTorch's CPU index first; pip then sees it as satisfied.
        run: |
          TORCH_VERSION=$(grep -oP '"torch==\K[^"]+' pyproject.toml)
          python -m pip install --upgrade pip
          python -m pip install "torch==${TORCH_VERSION}" --index-url https://download.pytorch.org/whl/cpu

      - name: Install package and dev tools
        run: python -m pip install -r requirements.txt

      - name: Lint
        run: make lint

      - name: Test
        run: make test
